<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #202020; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas-host { width: 100vw; height: 100vh; }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 13px;
      pointer-events: none;
      transition: opacity 0.3s;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 6px;
    }
    #status.hidden { opacity: 0; }
  </style>
    <script type="importmap">
    { "imports": { "three": "./three/three.module.min.js" } }
  </script>
</head>
<body>
<div id="canvas-host"></div>
<div id="status">Click on an entry to preview.</div>
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './three/loaders/GLTFLoader.js';
    import { OrbitControls } from './three/controls/OrbitControls.js';

    const status = document.getElementById('status');
    const host = document.getElementById('canvas-host');

    // ─── Renderer / scene ────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    host.appendChild(renderer.domElement);

    const canvas = renderer.domElement;
    canvas.tabIndex = 0;            // keyboard reach for WASD / F
    canvas.style.outline = 'none';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x445566, 2.4);
    scene.add(hemisphereLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(1, 2, 1.5);
    scene.add(keyLight);
    let lightingMode = 'day';

    function setLightingMode(mode) {
      if (!(mode === 'all' || mode === 'day' || mode === 'night')) return;
      lightingMode = mode;
      const night = mode === 'night';
      scene.background.setHex(night ? 0x101622 : 0x202020);
      hemisphereLight.color.setHex(night ? 0x9bbcff : 0xffffff);
      hemisphereLight.groundColor.setHex(night ? 0x172033 : 0x445566);
      hemisphereLight.intensity = night ? 0.85 : 2.4;
      keyLight.color.setHex(night ? 0xadc6ff : 0xffffff);
      keyLight.intensity = night ? 0.9 : 1.6;
    }

    // ─── Cameras: shared orbit target, perspective + true orthographic ───
    // Elevation convention matches BethesdaMultitool's OrthoViewProjBuilder:
    // 0° = side view, 90° = top-down (three.js polar = 90° − elevation).
    const PROJECTION_ELEVATION = { orthographic: 90, isometric: 30, trimetric: 25.65891 };
    const perspCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 1000);
    let camera = perspCamera;
    let projectionMode = 'perspective';

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = false;
    // Make vertical translation available through right/middle drag and the
    // arrow keys.  OrbitControls does not subscribe to keyboard events until
    // listenToKeyEvents is called explicitly.
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.PAN;
    controls.listenToKeyEvents(window);

    let modelRoot = null;
    let framingRadius = 1;
    let framingCenter = new THREE.Vector3();

    // ─── Control modes: orbit / fly / walk ────────────────────────────────
    // Fly/walk are first-person and perspective-only, modeled on
    // Xbox360MemoryCarver's FlythroughCameraController with its Z-up world-up
    // mapped to three.js Y-up. Orbit is the classic OrbitControls behavior.
    const FLY_SPEED_FACTOR = 0.6;    // base fly speed = framingRadius × 0.6 /s
    const WALK_SPEED_FACTOR = 0.12;  // base walk speed = framingRadius × 0.12 /s
    const WALK_SPEED_EYE_FACTOR = 1.2;
    const WALK_NEAR_EYE_FACTOR = 0.08;
    const ORBIT_VERTICAL_SPEED_FACTOR = 0.5;
    // Standing eye height = 1.7 × (framingRadius / 50): human-sized when the
    // model's bounding sphere is skate-level scale, clamped to sane bounds.
    const EYE_HEIGHT_FACTOR = 0.034;
    const MOUSE_SENSITIVITY = 0.003;                 // rad per dragged px
    const PITCH_LIMIT = THREE.MathUtils.degToRad(89.9);
    const WALK_STEP_SMOOTHING = 12;                  // 1/s exponential approach
    const WORLD_UP = new THREE.Vector3(0, 1, 0);
    const WORLD_DOWN = new THREE.Vector3(0, -1, 0);
    const TRACKED_KEYS = new Set([
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
      'ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight']);

    let controlMode = 'fly';
    controls.enabled = false;
    let isLevelModel = false;
    let flySpeed = 1;
    let walkSpeed = 0.2;
    let eyeHeight = 0.1;
    let walkEyeHeightHint = null;
    let lastGroundY = null;     // last known ground height — raycast misses keep it
    let walkYSettled = false;   // first grounded frame after entering walk snaps
    let lookPointerId = null;
    let lookLastX = 0;
    let lookLastY = 0;
    const keysDown = new Set();
    const flyEuler = new THREE.Euler(0, 0, 0, 'YXZ'); // yaw about world Y, pitch clamped, roll 0
    const raycaster = new THREE.Raycaster();
    const tmpForward = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const tmpMove = new THREE.Vector3();
    const tmpRayOrigin = new THREE.Vector3();

    // ─── Animation ────────────────────────────────────────────────────────
    let mixer = null;
    let activeAction = null;
    let clips = [];
    let playing = false;
    let timeTimer = null;
    let lastPostedTime = -1;
    let textureWibbleMeshes = [];
    let textureWibbleFrame = 0;
    let psxGpuMaterials = [];
    const psxDrawingBufferSize = new THREE.Vector2();
    const clock = new THREE.Clock();

    // rcossin_tbl samples used to construct the PS1 engine's 16 x 64
    // texture-wibble table. Keeping the integer samples reproduces the native
    // fixed-point result instead of substituting a subtly different host sine.
    const PSX_WIBBLE_SINE = new Int16Array([
      0, 401, 799, 1189, 1567, 1931, 2276, 2598,
      2896, 3166, 3406, 3612, 3784, 3920, 4017, 4076,
      4096, 4076, 4017, 3920, 3784, 3612, 3406, 3166,
      2896, 2598, 2276, 1931, 1567, 1189, 799, 401,
      0, -401, -799, -1189, -1567, -1931, -2276, -2598,
      -2896, -3166, -3406, -3612, -3784, -3920, -4017, -4076,
      -4096, -4076, -4017, -3920, -3784, -3612, -3406, -3166,
      -2896, -2598, -2276, -1931, -1567, -1189, -799, -401
    ]);

    function post(obj) {
      if (window.chrome && window.chrome.webview)
        window.chrome.webview.postMessage(JSON.stringify(obj));
    }

    function currentAnimTime() {
      return activeAction ? activeAction.time : 0;
    }

    function startTimeLoop() {
      stopTimeLoop();
      timeTimer = setInterval(() => {
        // Only cross the WebView2 boundary when the slider-resolution value
        // actually changed.
        const t = Math.round(currentAnimTime() * 100) / 100;
        if (t === lastPostedTime) return;
        lastPostedTime = t;
        post({ type: 'time', value: t });
      }, 100);
    }

    function stopTimeLoop() {
      if (timeTimer) {
        clearInterval(timeTimer);
        timeTimer = null;
      }
    }

    // ─── Render loop ──────────────────────────────────────────────────────
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (mixer && playing) mixer.update(dt);
      updatePsxTextureWibbles(Math.min(dt, 0.1));
      updatePsxGpuShaderUniforms();
      if (controlMode === 'orbit') updateOrbit(Math.min(dt, 0.1));
      else updateFlyWalk(Math.min(dt, 0.1)); // clamp tab-stall dt spikes
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraFrustum();
    });

    // ─── Framing / projection ─────────────────────────────────────────────
    function updateCameraFrustum() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      perspCamera.aspect = aspect;
      perspCamera.updateProjectionMatrix();

      const halfH = framingRadius * 1.15;
      orthoCamera.left = -halfH * aspect;
      orthoCamera.right = halfH * aspect;
      orthoCamera.top = halfH;
      orthoCamera.bottom = -halfH;
      orthoCamera.updateProjectionMatrix();
    }

    function frameModel(root) {
      const box = new THREE.Box3().setFromObject(root);
      if (box.isEmpty()) {
        framingRadius = 1;
        framingCenter.set(0, 0, 0);
      } else {
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        framingRadius = Math.max(sphere.radius, 1e-4);
        framingCenter.copy(sphere.center);
      }

      const near = framingRadius / 100;
      const far = framingRadius * 100;
      perspCamera.near = near;
      perspCamera.far = far;
      orthoCamera.near = near;
      orthoCamera.far = far;
      orthoCamera.zoom = 1;
      updateCameraFrustum();

      // Scale the first-person tuning to the model so tiny props and whole
      // worldzones both feel right; the wheel adjusts from these bases.
      const hasEyeHeightHint = Number.isFinite(walkEyeHeightHint) && walkEyeHeightHint > 0;
      flySpeed = framingRadius * FLY_SPEED_FACTOR;
      eyeHeight = hasEyeHeightHint
        ? walkEyeHeightHint
        : THREE.MathUtils.clamp(
            framingRadius * EYE_HEIGHT_FACTOR, framingRadius * 0.01, framingRadius * 0.1);
      walkSpeed = hasEyeHeightHint
        ? eyeHeight * WALK_SPEED_EYE_FACTOR
        : framingRadius * WALK_SPEED_FACTOR;
      lastGroundY = null;
      walkYSettled = false;

      controls.target.copy(framingCenter);
      placeCamera(0, projectionElevation());
      if (controlMode === 'orbit') controls.update();
    }

    function projectionElevation() {
      return PROJECTION_ELEVATION[projectionMode] ?? 0;
    }

    function orbitDistance() {
      return projectionMode === 'perspective'
        ? framingRadius / Math.tan(THREE.MathUtils.degToRad(perspCamera.fov / 2)) * 1.15
        : framingRadius * 4;
    }

    function placeCamera(azimuthDeg, elevationDeg) {
      const az = THREE.MathUtils.degToRad(azimuthDeg);
      const el = THREE.MathUtils.degToRad(elevationDeg);
      const r = orbitDistance();
      camera.position.set(
        framingCenter.x + r * Math.cos(el) * Math.sin(az),
        framingCenter.y + r * Math.sin(el),
        framingCenter.z + r * Math.cos(el) * Math.cos(az));
      camera.lookAt(framingCenter);
      if (controlMode === 'orbit') controls.update();
    }

    function applyPolarLock() {
      if (projectionMode === 'perspective') {
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;
      } else {
        const polar = THREE.MathUtils.degToRad(90 - projectionElevation());
        controls.minPolarAngle = polar;
        controls.maxPolarAngle = polar;
      }
    }

    function applyProjection(mode) {
      const azimuthDeg = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle());
      projectionMode = mode;
      camera = mode === 'perspective' ? perspCamera : orthoCamera;
      controls.object = camera;
      applyPolarLock();
      const baseAz = mode === 'isometric' || mode === 'trimetric' ? 45 : azimuthDeg;
      placeCamera(mode === 'perspective' ? azimuthDeg : baseAz,
                  mode === 'perspective' ? 10 : projectionElevation());
    }

    function setProjection(mode) {
      if (!(mode === 'perspective' || mode in PROJECTION_ELEVATION)) return;
      if (controlMode !== 'orbit') {
        // Fly/walk are perspective-only — remember the choice and apply it
        // when control returns to orbit.
        projectionMode = mode;
        return;
      }
      applyProjection(mode);
    }

    function setCamera(azimuthDeg, elevationDeg) {
      exitToOrbitForPreset();
      if (projectionMode !== 'perspective') {
        // Elevation is locked by the projection; only azimuth applies.
        elevationDeg = projectionElevation();
      }
      placeCamera(azimuthDeg, elevationDeg);
    }

    // ◄ ► 90° snap, ported from BethesdaMultitool WorldView3DControl:
    // aligned → step a full quadrant; off-axis → snap to the next aligned
    // azimuth in the arrow's direction.
    function stepAzimuth(dir) {
      exitToOrbitForPreset();
      const baseDeg = projectionMode === 'isometric' || projectionMode === 'trimetric' ? 45 : 0;
      const azDeg = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle());
      const rel = (azDeg - baseDeg) / 90;
      const nearest = Math.round(rel);
      let quad;
      if (Math.abs(rel - nearest) < 0.01)
        quad = nearest + dir;
      else
        quad = dir > 0 ? Math.ceil(rel) : Math.floor(rel);
      const elevationDeg = projectionMode === 'perspective'
        ? THREE.MathUtils.radToDeg(Math.PI / 2 - controls.getPolarAngle())
        : projectionElevation();
      placeCamera(quad * 90 + baseDeg, elevationDeg);
    }

    // ─── Fly / walk control modes ─────────────────────────────────────────
    function setControlMode(mode) {
      if (!(mode === 'orbit' || mode === 'fly' || mode === 'walk')) return;
      if (mode === controlMode) return;
      controlMode = mode;
      if (mode === 'orbit') enterOrbit('ahead');
      else enterFlyWalk(mode);
      post({ type: 'controlMode', mode: mode });
    }

    // F always selects/toggles the two first-person modes. O independently
    // toggles Orbit, returning to Fly when Orbit is switched off.
    function toggleFlyWalkMode() {
      if (!modelRoot) return;
      setControlMode(controlMode === 'fly' ? 'walk' : 'fly');
    }

    function toggleOrbitMode() {
      if (!modelRoot) return;
      setControlMode(controlMode === 'orbit' ? 'fly' : 'orbit');
    }

    function enterOrbit(retarget) {
      camera = perspCamera;
      controls.object = perspCamera;
      perspCamera.near = framingRadius / 100;
      perspCamera.updateProjectionMatrix();
      if (retarget === 'ahead' && projectionMode === 'perspective') {
        // Keep the camera pose and aim the orbit pivot at a point ahead of it
        // so handing control back to OrbitControls doesn't jump the view.
        perspCamera.getWorldDirection(tmpForward);
        controls.target.copy(perspCamera.position)
          .addScaledVector(tmpForward, framingRadius * 0.75);
      } else {
        // Ortho/iso/trimetric vantages are center-locked, so a pending
        // non-perspective projection re-applies around the model center.
        controls.target.copy(framingCenter);
      }
      controls.enabled = true;
      controls.update();
      if (projectionMode !== 'perspective') applyProjection(projectionMode);
    }

    function enterFlyWalk(mode) {
      if (camera !== perspCamera) {
        // Fly/walk are perspective-only. Seed the perspective camera from the
        // current ortho pose; the projection re-applies on return to orbit.
        perspCamera.position.copy(camera.position);
        perspCamera.quaternion.copy(camera.quaternion);
        camera = perspCamera;
      }
      controls.enabled = false;
      // Walls at walking distance clip at the orbit near plane (radius/100).
      const radiusNear = framingRadius / 300;
      perspCamera.near = Number.isFinite(walkEyeHeightHint) && walkEyeHeightHint > 0
        ? Math.max(1e-4, Math.min(radiusNear, walkEyeHeightHint * WALK_NEAR_EYE_FACTOR))
        : radiusNear;
      perspCamera.updateProjectionMatrix();
      flyEuler.setFromQuaternion(perspCamera.quaternion);
      flyEuler.z = 0; // no roll
      perspCamera.quaternion.setFromEuler(flyEuler);
      if (mode === 'walk') walkYSettled = false; // seat on the ground directly
    }

    // Named views / azimuth snaps are orbit vantages — using one from
    // fly/walk returns to orbit around the model center first.
    function exitToOrbitForPreset() {
      if (controlMode === 'orbit') return;
      controlMode = 'orbit';
      enterOrbit('center');
      post({ type: 'controlMode', mode: 'orbit' });
    }

    // Fly is the predictable default for every mesh. Orbit and Walk remain
    // one-key alternatives, independent of whether the mesh is level-sized.
    function applyDefaultControlMode() {
      const mode = 'fly';
      if (mode === controlMode) {
        // Same mode as the previous model — still re-seed fly state (and the
        // walk ground snap) from the freshly framed camera.
        if (mode !== 'orbit') enterFlyWalk(mode);
        return;
      }
      controlMode = mode;
      if (mode === 'orbit') enterOrbit('center');
      else enterFlyWalk(mode);
      post({ type: 'controlMode', mode: mode });
    }

    function applyMouseLook(dx, dy) {
      // FPS-style: drag right looks right, drag down looks down (carver
      // non-inverted semantics), pitch clamped just short of vertical.
      flyEuler.y -= dx * MOUSE_SENSITIVITY;
      flyEuler.x = THREE.MathUtils.clamp(
        flyEuler.x - dy * MOUSE_SENSITIVITY, -PITCH_LIMIT, PITCH_LIMIT);
      perspCamera.quaternion.setFromEuler(flyEuler);
    }

    function updateFlyWalk(dt) {
      if (dt <= 0) return;
      let mult = 1;
      if (keysDown.has('ShiftLeft') || keysDown.has('ShiftRight')) mult *= 4;
      if (keysDown.has('ControlLeft') || keysDown.has('ControlRight')) mult *= 0.25;
      const speed = (controlMode === 'walk' ? walkSpeed : flySpeed) * mult;

      perspCamera.getWorldDirection(tmpForward);
      tmpRight.crossVectors(tmpForward, WORLD_UP).normalize();
      tmpMove.set(0, 0, 0);

      if (controlMode === 'walk') {
        // Ground-plane projection: looking up must not turn W into a climb.
        tmpForward.y = 0;
        if (tmpForward.lengthSq() > 1e-8) tmpForward.normalize();
        if (keysDown.has('KeyW')) tmpMove.add(tmpForward);
        if (keysDown.has('KeyS')) tmpMove.sub(tmpForward);
        if (keysDown.has('KeyD')) tmpMove.add(tmpRight);
        if (keysDown.has('KeyA')) tmpMove.sub(tmpRight);
        // Q/E intentionally ignored — the ground raycast owns the Y axis.
      } else {
        if (keysDown.has('KeyW')) tmpMove.add(tmpForward);
        if (keysDown.has('KeyS')) tmpMove.sub(tmpForward);
        if (keysDown.has('KeyD')) tmpMove.add(tmpRight);
        if (keysDown.has('KeyA')) tmpMove.sub(tmpRight);
        if (keysDown.has('KeyE')) tmpMove.add(WORLD_UP);
        if (keysDown.has('KeyQ')) tmpMove.sub(WORLD_UP);
      }

      if (tmpMove.lengthSq() > 0)
        perspCamera.position.addScaledVector(tmpMove.normalize(), speed * dt);

      if (controlMode === 'walk') updateWalkHeight(dt);
    }

    function updateOrbit(dt) {
      controls.update();
      if (dt <= 0) return;

      // Q/E retain their Fly-mode meaning while orbiting: translate both the
      // camera and pivot vertically, rather than changing the look angle.
      const direction = (keysDown.has('KeyE') ? 1 : 0) - (keysDown.has('KeyQ') ? 1 : 0);
      if (direction === 0) return;
      const distance = Math.max(controls.getDistance(), framingRadius * 0.1);
      tmpMove.copy(WORLD_UP).multiplyScalar(
        direction * distance * ORBIT_VERTICAL_SPEED_FACTOR * dt);
      camera.position.add(tmpMove);
      controls.target.add(tmpMove);
      controls.update();
    }

    function updateWalkHeight(dt) {
      if (!modelRoot) return;
      const pos = perspCamera.position;
      // Cast from one eye-height above the eye so kerbs/ramps up to roughly
      // 2× eye height above the ground are climbable without snapping onto
      // roofs far overhead.
      tmpRayOrigin.set(pos.x, pos.y + eyeHeight, pos.z);
      raycaster.set(tmpRayOrigin, WORLD_DOWN);
      raycaster.far = framingRadius * 4;
      const hits = raycaster.intersectObject(modelRoot, true);
      if (hits.length > 0) lastGroundY = hits[0].point.y;
      if (lastGroundY === null) return; // never saw ground — keep the current height
      const targetY = lastGroundY + eyeHeight;
      if (!walkYSettled) {
        walkYSettled = true;
        pos.y = targetY;
        return;
      }
      // Frame-rate-independent exponential approach (~12/s) so a stair step
      // reads as stepping up instead of a snap cut.
      pos.y += (targetY - pos.y) * (1 - Math.exp(-WALK_STEP_SMOOTHING * dt));
      if (Math.abs(targetY - pos.y) < framingRadius * 1e-4) pos.y = targetY;
    }

    // ─── First-person input (fly/walk) ────────────────────────────────────
    const activePointers = new Map();

    function buttonMask(button) {
      if (button === 0) return 1;
      if (button === 1) return 4;
      if (button === 2) return 2;
      return 0;
    }

    function cancelPointerInteraction(pointerId, pointerType = 'mouse') {
      if (!activePointers.delete(pointerId)) return;
      // OrbitControls and first-person look both listen for pointercancel.
      // Sending the normal cancellation path also releases pointer capture
      // and removes OrbitControls' temporary move/up listeners.
      canvas.dispatchEvent(new PointerEvent('pointercancel', {
        pointerId: pointerId,
        pointerType: pointerType,
        buttons: 0
      }));
    }

    function cancelAllPointerInteractions() {
      for (const pointerId of [...activePointers.keys()])
        cancelPointerInteraction(pointerId);
    }

    // A mouse-up can occur outside the WebView while Chromium still considers
    // the canvas to own pointer capture. Cancel before either controller sees
    // the returning move, otherwise it applies the entire off-view delta and
    // the camera snaps to the cursor.
    canvas.addEventListener('pointermove', e => {
      const pressedMask = activePointers.get(e.pointerId);
      if (pressedMask !== undefined && e.pointerType === 'mouse'
          && (e.buttons & pressedMask) === 0) {
        cancelPointerInteraction(e.pointerId, e.pointerType);
      }
    }, { capture: true });

    canvas.addEventListener('pointerdown', e => {
      const mask = buttonMask(e.button);
      if (mask !== 0) activePointers.set(e.pointerId, mask);
      canvas.focus(); // keyboard reach after any click
      if (controlMode === 'orbit' || e.button !== 0) return;
      lookPointerId = e.pointerId;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', e => {
      if (controlMode === 'orbit' || e.pointerId !== lookPointerId) return;
      const dx = e.clientX - lookLastX;
      const dy = e.clientY - lookLastY;
      lookLastX = e.clientX;
      lookLastY = e.clientY;
      if (dx !== 0 || dy !== 0) applyMouseLook(dx, dy);
    });

    function endLookDrag(e) {
      activePointers.delete(e.pointerId);
      if (e.pointerId !== lookPointerId) return;
      lookPointerId = null;
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    }
    canvas.addEventListener('pointerup', endLookDrag);
    canvas.addEventListener('pointercancel', endLookDrag);
    canvas.addEventListener('pointerleave', cancelAllPointerInteractions);
    function endWindowPointer(e) {
      // Normal canvas events already removed this id before bubbling here.
      // A page-level up/cancel means capture was lost, so route it through
      // the same cancellation event that resets OrbitControls too.
      if (activePointers.has(e.pointerId))
        cancelPointerInteraction(e.pointerId, e.pointerType);
      else
        endLookDrag(e);
    }
    window.addEventListener('pointerup', endWindowPointer);
    window.addEventListener('pointercancel', endWindowPointer);
    window.addEventListener('mouseout', e => {
      if (e.relatedTarget === null) cancelAllPointerInteractions();
    });

    canvas.addEventListener('wheel', e => {
      if (controlMode === 'orbit') return; // OrbitControls owns the wheel
      e.preventDefault();
      // ×1.2 per notch (Chromium reports ~100 deltaY per notch), clamped so
      // one inertial burst can't run the speed away.
      const ticks = THREE.MathUtils.clamp(-e.deltaY / 100, -3, 3);
      const factor = Math.pow(1.2, ticks);
      if (controlMode === 'walk')
      {
        const walkScale = Number.isFinite(walkEyeHeightHint) && walkEyeHeightHint > 0
          ? walkEyeHeightHint
          : framingRadius;
        walkSpeed = THREE.MathUtils.clamp(
          walkSpeed * factor, walkScale * 0.1, walkScale * 20);
      }
      else
        flySpeed = THREE.MathUtils.clamp(
          flySpeed * factor, framingRadius * 0.01, framingRadius * 10);
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyF') {
        if (!e.repeat) toggleFlyWalkMode();
        e.preventDefault();
        return;
      }
      if (e.code === 'KeyO') {
        if (!e.repeat) toggleOrbitMode();
        e.preventDefault();
        return;
      }
      if (!TRACKED_KEYS.has(e.code)) return;
      // Per-frame integration reads the held set — key auto-repeat is a no-op.
      keysDown.add(e.code);
      if (controlMode !== 'orbit' || e.code === 'KeyQ' || e.code === 'KeyE')
        e.preventDefault();
    });
    window.addEventListener('keyup', e => keysDown.delete(e.code));
    window.addEventListener('blur', () => {
      keysDown.clear();
      cancelAllPointerInteractions();
    }); // stuck-input guard
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        keysDown.clear();
        cancelAllPointerInteractions();
      }
    });

    // ─── Model lifecycle ──────────────────────────────────────────────────
    function disposeModel(root) {
      root.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        const materials = Array.isArray(obj.material) ? obj.material : obj.material ? [obj.material] : [];
        for (const mat of materials) {
          for (const key of Object.keys(mat)) {
            const value = mat[key];
            if (value && value.isTexture) value.dispose();
          }
          mat.dispose();
        }
      });
    }

    let modelLoadGeneration = 0;

    function updatePsxGpuShaderUniforms() {
      if (psxGpuMaterials.length === 0) return;
      renderer.getDrawingBufferSize(psxDrawingBufferSize);
      for (const material of psxGpuMaterials) {
        const shader = material.userData.psxGpuShader;
        if (shader) shader.uniforms.psxViewportHeight.value = psxDrawingBufferSize.y;
      }
    }

    function configurePsxGpuVertexColors(root) {
      psxGpuMaterials = [];
      const materialStates = new Map();
      root.traverse(obj => {
        if (!obj.isMesh || !obj.geometry) return;
        // GLTFLoader preserves unknown glTF attributes by lowercasing their
        // semantic. Keep its standard COLOR_0 binding intact: packet-valid
        // flags select the native path, while synthetic/non-PS1 vertices keep
        // the portable linear colour without any geometry mutation.
        const psxColor = obj.geometry.getAttribute('_psx_color_0');
        const psxFlags = obj.geometry.getAttribute('_psx_flags_0');
        if (!psxColor || !psxFlags || psxColor.count !== psxFlags.count) return;

        let hasPacket = false;
        let hasTexturedPacket = false;
        for (let i = 0; i < psxFlags.count; i++) {
          if (psxFlags.getZ(i) < 0.5) continue;
          hasPacket = true;
          if (psxFlags.getX(i) >= 0.5) {
            hasTexturedPacket = true;
            break;
          }
        }

        const materials = Array.isArray(obj.material)
          ? obj.material
          : obj.material ? [obj.material] : [];
        for (const material of materials) {
          const state = materialStates.get(material) || {
            hasPacket: false,
            hasTexturedPacket: false
          };
          state.hasPacket ||= hasPacket;
          state.hasTexturedPacket ||= hasTexturedPacket;
          materialStates.set(material, state);
        }
      });

      for (const [material, state] of materialStates) {
        if (!state.hasPacket) continue;
        psxGpuMaterials.push(material);

        // PS1 sampling is nearest-neighbour with no mip levels. Do not apply
        // this to PC wibble or synthetic-only materials whose flags keep them
        // on the portable path.
        if (state.hasTexturedPacket && material.map) {
          material.map.magFilter = THREE.NearestFilter;
          material.map.minFilter = THREE.NearestFilter;
          material.map.generateMipmaps = false;
          material.map.needsUpdate = true;
        }

        const previousOnBeforeCompile = material.onBeforeCompile;
        material.onBeforeCompile = function(shader, webglRenderer) {
          previousOnBeforeCompile.call(this, shader, webglRenderer);
          renderer.getDrawingBufferSize(psxDrawingBufferSize);
          shader.uniforms.psxViewportHeight = { value: psxDrawingBufferSize.y };

          // WebGL interpolates varyings perspective-correctly. Multiplying
          // both custom attributes and a companion varying by clip W, then
          // dividing them in the fragment shader, recovers the PS1 GPU's
          // affine screen-space Gouraud interpolation. Standard vColor stays
          // untouched for packet-invalid procedural and non-PS1 geometry.
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <color_pars_vertex>',
              `#include <color_pars_vertex>
attribute vec4 _psx_color_0;
attribute vec3 _psx_flags_0;
varying vec4 vPsxPacketColorTimesW;
varying vec3 vPsxFlagsTimesW;
varying float vPsxClipW;`)
            .replace(
              '#include <project_vertex>',
              `#include <project_vertex>
vPsxPacketColorTimesW = _psx_color_0 * gl_Position.w;
vPsxFlagsTimesW = _psx_flags_0 * gl_Position.w;
vPsxClipW = gl_Position.w;`);

          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <color_pars_fragment>',
              `#include <color_pars_fragment>
uniform float psxViewportHeight;
varying vec4 vPsxPacketColorTimesW;
varying vec3 vPsxFlagsTimesW;
varying float vPsxClipW;

float psxLinearToSrgbChannel(float value) {
  value = max(value, 0.0);
  return value <= 0.0031308
    ? value * 12.92
    : 1.055 * pow(value, 1.0 / 2.4) - 0.055;
}

float psxSrgbToLinearChannel(float value) {
  value = max(value, 0.0);
  return value <= 0.04045
    ? value / 12.92
    : pow((value + 0.055) / 1.055, 2.4);
}

vec3 psxLinearToSrgb(vec3 value) {
  return vec3(
    psxLinearToSrgbChannel(value.r),
    psxLinearToSrgbChannel(value.g),
    psxLinearToSrgbChannel(value.b));
}

vec3 psxSrgbToLinear(vec3 value) {
  return vec3(
    psxSrgbToLinearChannel(value.r),
    psxSrgbToLinearChannel(value.g),
    psxSrgbToLinearChannel(value.b));
}

float psxDitherValue() {
  float x = mod(floor(gl_FragCoord.x), 4.0);
  float y = mod(floor(psxViewportHeight - gl_FragCoord.y), 4.0);
  if (y < 1.0) {
    if (x < 1.0) return -4.0;
    if (x < 2.0) return 0.0;
    if (x < 3.0) return -3.0;
    return 1.0;
  }
  if (y < 2.0) {
    if (x < 1.0) return 2.0;
    if (x < 2.0) return -2.0;
    if (x < 3.0) return 3.0;
    return -1.0;
  }
  if (y < 3.0) {
    if (x < 1.0) return -3.0;
    if (x < 2.0) return 1.0;
    if (x < 3.0) return -4.0;
    return 0.0;
  }
  if (x < 1.0) return 3.0;
  if (x < 2.0) return -1.0;
  if (x < 3.0) return 2.0;
  return -2.0;
}

vec3 psxQuantize5(vec3 display8, float ditherValue) {
  return clamp(floor((display8 + vec3(ditherValue)) / 8.0), 0.0, 31.0) / 31.0;
}`)
            .replace(
              '#include <color_fragment>',
              `float psxSafeClipW = max(vPsxClipW, 0.000001);
vec4 psxPacketColor = vPsxPacketColorTimesW / psxSafeClipW;
vec3 psxFlags = vPsxFlagsTimesW / psxSafeClipW;
if (psxFlags.z < 0.5) {
  #if defined( USE_COLOR_ALPHA )
    diffuseColor *= vColor;
  #elif defined( USE_COLOR )
    diffuseColor.rgb *= vColor;
  #endif
} else {
  vec3 packet8 = floor(clamp(psxPacketColor.rgb, 0.0, 1.0) * 255.0 + 0.0001);
  float ditherValue = psxDitherValue();
  if (psxFlags.x >= 0.5) {
    // Authored textured faces remain texture-modulated even when their image
    // could not be resolved. A white 5-bit texel is the neutral missing-image
    // fallback; treating packet RGB as flat colour halves neutral modulation.
    vec3 texel5 = vec3(31.0);
    #ifdef USE_MAP
      texel5 = floor(clamp(psxLinearToSrgb(diffuseColor.rgb), 0.0, 1.0) * 31.0 + 0.5);
    #endif
    // Retail PS1 GPU v2: (5-bit texel * 8-bit packet colour) >> 4,
    // followed by the 4x4 dither and conversion back to 5-bit display RGB.
    vec3 modulated8 = floor(texel5 * packet8 / 16.0);
    diffuseColor.rgb = psxSrgbToLinear(psxQuantize5(modulated8, ditherValue));
  } else {
    // Flat untextured primitives bypass dithering; authored Gouraud state is
    // explicit instead of being guessed from screen-space derivatives.
    float flatDither = psxFlags.y >= 0.5 ? ditherValue : 0.0;
    diffuseColor.rgb = psxSrgbToLinear(psxQuantize5(packet8, flatDither));
  }
  diffuseColor.a *= clamp(psxPacketColor.a, 0.0, 1.0);
}`);

          material.userData.psxGpuShader = shader;
        };
        material.customProgramCacheKey = () => 'psx-gpu-color-v2';
        material.needsUpdate = true;
      }
    }

    function configurePsxTextureWibbles(root) {
      textureWibbleMeshes = [];
      textureWibbleFrame = 0;
      root.traverse(obj => {
        if (!obj.isMesh || !obj.geometry) return;
        const geometry = obj.geometry;
        const uv = geometry.getAttribute('uv');
        const motion = geometry.getAttribute('_psx_uv_wibble_0');
        const wave = geometry.getAttribute('_psx_uv_wibble_1');
        const size = geometry.getAttribute('_psx_uv_wibble_2');
        if (!uv || !motion || !wave || !size ||
            uv.count !== motion.count || uv.count !== wave.count || uv.count !== size.count) {
          return;
        }

        const baseUv = new Float32Array(uv.count * 2);
        for (let i = 0; i < uv.count; i++) {
          baseUv[i * 2] = uv.getX(i);
          baseUv[i * 2 + 1] = uv.getY(i);
        }
        textureWibbleMeshes.push({ uv, motion, wave, size, baseUv });
      });
    }

    function psxWibbleSample(basePhase, phase, amplitude) {
      const sampleIndex = ((basePhase + phase * 4) % 64 + 64) % 64;
      // The native table stores (rcossin_tbl[sample] * amplitude) >> 4.
      return (PSX_WIBBLE_SINE[sampleIndex] * amplitude) >> 4;
    }

    function updatePsxTextureWibbles(dt) {
      if (textureWibbleMeshes.length === 0) return;
      textureWibbleFrame = (textureWibbleFrame + dt * 60) % 0x100000;
      const nativeFrame = Math.floor(textureWibbleFrame);

      for (const entry of textureWibbleMeshes) {
        const { uv, motion, wave, size, baseUv } = entry;
        for (let i = 0; i < uv.count; i++) {
          const baseU = baseUv[i * 2];
          const baseV = baseUv[i * 2 + 1];
          if (motion.getW(i) < 0.5) {
            uv.setXY(i, baseU, baseV);
            continue;
          }

          const width = Math.max(1, size.getX(i));
          const height = Math.max(1, size.getY(i));
          const frequency = Math.round(motion.getZ(i));
          const basePhase = Math.floor(nativeFrame * frequency / 1024);
          const uScroll = Math.floor(nativeFrame * motion.getX(i) / 16);
          const vScroll = Math.floor(nativeFrame * motion.getY(i) / 16);
          const uWibble = psxWibbleSample(
            basePhase, Math.round(wave.getY(i)), Math.round(wave.getX(i)));
          const vWibble = psxWibbleSample(
            basePhase, Math.round(wave.getW(i)), Math.round(wave.getZ(i)));

          uv.setXY(
            i,
            baseU + (uScroll + uWibble) / (256 * width),
            baseV + (vScroll + vWibble) / (256 * height));
        }
        uv.needsUpdate = true;
      }
    }

    function applyPsxSemiTransparentUnlit(root) {
      // PS1 ABR 0 (average: B/2 + F/2) and ABR 2 (subtractive) draw with raw
      // packet colours — the GPU never lit them. Scene lighting multiplies a
      // dark blend colour above the background it should darken, inverting
      // the effect (the l1a1 "?" marker's dark-blue glass sheets became a
      // pale haze). Swap those materials to unlit equivalents; runs BEFORE
      // configurePsxGpuVertexColors so the PS1 GPU patch lands on the
      // replacement (MeshBasicMaterial shares the patched shader chunks).
      const unlitBySource = new Map();
      root.traverse(obj => {
        if (!obj.isMesh || !obj.material) return;
        const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
        let changed = false;
        const replaced = materials.map(material => {
          if (!/__st[02](?:__2sided)?$/.test(material.name || '')) return material;
          let unlit = unlitBySource.get(material);
          if (!unlit) {
            unlit = new THREE.MeshBasicMaterial();
            unlit.copy(material);
            unlitBySource.set(material, unlit);
          }
          changed = true;
          return unlit;
        });
        if (!changed) return;
        obj.material = Array.isArray(obj.material) ? replaced : replaced[0];
      });
    }

    function applyNativeMaterialBlending(root) {
      root.traverse(obj => {
        const materials = Array.isArray(obj.material)
          ? obj.material
          : obj.material ? [obj.material] : [];
        for (const material of materials) {
          // PS1 ABR 1/3 are B+F and B+0.25F. Core glTF has no additive
          // blend mode, so the exporter identifies its portable alpha
          // approximation in the material name. Apply the closest three.js
          // additive equation in our viewer: unlike normal source-alpha blending this
          // never darkens the destination behind fire, spotlights, or glows.
          if (!/__st[13](?:__2sided)?$/.test(material.name || '')) continue;
          material.transparent = true;
          material.blending = THREE.AdditiveBlending;
          material.depthWrite = false;
          material.needsUpdate = true;
        }
      });
    }

    function cancelModelLoad() {
      modelLoadGeneration++;
    }

    function unloadCurrent() {
      cancelModelLoad();
      stopTimeLoop();
      playing = false;
      if (mixer) {
        mixer.stopAllAction();
        mixer = null;
      }
      activeAction = null;
      clips = [];
      textureWibbleMeshes = [];
      psxGpuMaterials = [];
      textureWibbleFrame = 0;
      if (modelRoot) {
        scene.remove(modelRoot);
        disposeModel(modelRoot);
        modelRoot = null;
      }
    }

    function captureCameraState() {
      if (!modelRoot) return null;
      return {
        projectionMode: projectionMode,
        controlMode: controlMode,
        position: camera.position.toArray(),
        quaternion: camera.quaternion.toArray(),
        target: controls.target.toArray(),
        orthoZoom: orthoCamera.zoom,
        flySpeed: flySpeed,
        walkSpeed: walkSpeed
      };
    }

    function isFiniteArray(value, length) {
      return Array.isArray(value)
        && value.length === length
        && value.every(Number.isFinite);
    }

    function restoreCameraState(state) {
      if (!state
          || !isFiniteArray(state.position, 3)
          || !isFiniteArray(state.quaternion, 4)
          || !isFiniteArray(state.target, 3)) {
        return false;
      }

      projectionMode = state.projectionMode === 'perspective'
        || state.projectionMode in PROJECTION_ELEVATION
        ? state.projectionMode
        : 'perspective';
      controlMode = state.controlMode === 'orbit'
        || state.controlMode === 'fly'
        || state.controlMode === 'walk'
        ? state.controlMode
        : 'fly';

      camera = controlMode === 'orbit' && projectionMode !== 'perspective'
        ? orthoCamera
        : perspCamera;
      controls.object = camera;
      camera.position.fromArray(state.position);
      camera.quaternion.fromArray(state.quaternion).normalize();
      controls.target.fromArray(state.target);
      if (Number.isFinite(state.orthoZoom) && state.orthoZoom > 0)
        orthoCamera.zoom = state.orthoZoom;

      // A visibility variant can have smaller bounds than the full mesh. Keep
      // a previously distant camera inside the new far plane instead of
      // preserving its coordinates only to clip the replacement model away.
      const distance = camera.position.distanceTo(framingCenter);
      const restoredFar = Math.max(
        framingRadius * 100,
        distance + framingRadius * 4);
      perspCamera.far = restoredFar;
      orthoCamera.far = restoredFar;
      perspCamera.updateProjectionMatrix();
      orthoCamera.updateProjectionMatrix();

      applyPolarLock();
      controls.enabled = controlMode === 'orbit';
      if (controlMode === 'orbit') {
        controls.update();
      } else {
        // Reapply the first-person near plane and Euler state that frameModel
        // intentionally resets for a fresh model, without moving the camera.
        enterFlyWalk(controlMode);
        if (Number.isFinite(state.flySpeed) && state.flySpeed > 0)
          flySpeed = state.flySpeed;
        if (Number.isFinite(state.walkSpeed) && state.walkSpeed > 0)
          walkSpeed = state.walkSpeed;
        // Do not snap a preserved walk camera on its first rendered frame.
        // The next raycast can still ease it onto newly visible ground.
        lastGroundY = null;
        walkYSettled = true;
      }

      post({ type: 'controlMode', mode: controlMode });
      return true;
    }

    function loadModel(base64Glb, isLevel, eyeHeightHint, preserveCamera) {
      // Snapshot immediately before unloading. Conversion happens host-side,
      // so this also retains any camera movement made while it was running.
      const cameraState = preserveCamera === true ? captureCameraState() : null;
      status.textContent = 'Loading model...';
      status.classList.remove('hidden');
      unloadCurrent();
      const loadGeneration = modelLoadGeneration;
      isLevelModel = isLevel === true;
      walkEyeHeightHint = Number.isFinite(eyeHeightHint) && eyeHeightHint > 0
        ? eyeHeightHint
        : null;

      try {
        const binary = atob(base64Glb);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        new GLTFLoader().parse(bytes.buffer, '', gltf => {
          if (loadGeneration !== modelLoadGeneration) {
            disposeModel(gltf.scene);
            return;
          }
          modelRoot = gltf.scene;
          applyPsxSemiTransparentUnlit(modelRoot);
          configurePsxGpuVertexColors(modelRoot);
          configurePsxTextureWibbles(modelRoot);
          applyNativeMaterialBlending(modelRoot);
          scene.add(modelRoot);
          frameModel(modelRoot);
          if (!restoreCameraState(cameraState)) applyDefaultControlMode();
          canvas.focus();

          clips = gltf.animations || [];
          const names = clips.map(c => c.name);
          let duration = 0;
          if (clips.length > 0) {
            mixer = new THREE.AnimationMixer(modelRoot);
            activeAction = mixer.clipAction(clips[0]);
            activeAction.play();
            duration = clips[0].duration || 0;
            playing = true;
            startTimeLoop();
          }

          status.classList.add('hidden');
          post({ type: 'loaded', animations: names, duration: duration });
        }, () => {
          if (loadGeneration !== modelLoadGeneration) return;
          status.textContent = 'Failed to load model';
          status.classList.remove('hidden');
        });
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
        status.classList.remove('hidden');
      }
    }

    function playAnim() {
      playing = true;
      startTimeLoop();
    }

    function pauseAnim() {
      playing = false;
      stopTimeLoop();
      post({ type: 'time', value: currentAnimTime() });
    }

    function seekAnim(t) {
      if (activeAction) {
        activeAction.time = t;
        if (mixer && !playing) mixer.update(0);
      }
      if (!playing)
        post({ type: 'time', value: t });
    }

    function setAnim(name) {
      if (!mixer) return;
      const clip = clips.find(c => c.name === name);
      if (!clip) return;
      if (activeAction) activeAction.stop();
      activeAction = mixer.clipAction(clip);
      activeAction.play();
      if (!playing) mixer.update(0);
      post({ type: 'loaded', animations: clips.map(c => c.name), duration: clip.duration || 0 });
    }

    function clearModel() {
      unloadCurrent();
      isLevelModel = false;
      walkEyeHeightHint = null;
      if (controlMode !== 'fly') {
        controlMode = 'fly';
        enterFlyWalk('fly');
        post({ type: 'controlMode', mode: 'fly' });
      }
      status.textContent = 'Click on an entry to preview.';
      status.classList.remove('hidden');
    }

    function setStatus(text) {
      status.textContent = text;
      status.classList.remove('hidden');
    }

    // ExecuteScriptAsync calls arrive as plain script — expose the contract.
    window.loadModel = loadModel;
    window.clearModel = clearModel;
    window.setStatus = setStatus;
    window.playAnim = playAnim;
    window.pauseAnim = pauseAnim;
    window.seekAnim = seekAnim;
    window.setAnim = setAnim;
    window.setProjection = setProjection;
    window.setCamera = setCamera;
    window.stepAzimuth = stepAzimuth;
    window.setControlMode = setControlMode;
    window.setLightingMode = setLightingMode;
    window.cancelModelLoad = cancelModelLoad;
    post({ type: 'ready' });
  </script>
</body>
</html>
