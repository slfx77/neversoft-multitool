<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script type="module" src="model-viewer.min.js"></script>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #202020; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
      --progress-bar-color: #60cdff;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 13px;
      pointer-events: none;
      transition: opacity 0.3s;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 6px;
    }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
<model-viewer id="viewer"
              camera-controls
              camera-orbit="0deg 90deg auto"
              shadow-intensity="0.5"
              exposure="1.0"
              environment-image="neutral"
              interaction-prompt="none">
</model-viewer>
<div id="status">Click on an entry to preview.</div>
<script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    let currentBlobUrl = null;
    let timeTimer = null;
    let lastPostedTime = -1;

    // Messages to the WinUI host (ModelViewerControl). Always JSON strings.
    function post(obj) {
      if (window.chrome && window.chrome.webview)
        window.chrome.webview.postMessage(JSON.stringify(obj));
    }

    function startTimeLoop() {
      stopTimeLoop();
      timeTimer = setInterval(() => {
        // Only cross the WebView2 boundary when the slider-resolution value
        // actually changed.
        const t = Math.round((viewer.currentTime || 0) * 100) / 100;
        if (t === lastPostedTime) return;
        lastPostedTime = t;
        post({ type: 'time', value: t });
      }, 100);
    }

    // viewer.duration is populated asynchronously once the clip is bound;
    // retry a few frames so the host never sees duration=0 for an animated
    // model (which would hide the transport).
    function postLoadedWhenReady(anims, attempts) {
      const d = viewer.duration || 0;
      if (anims.length > 0 && d === 0 && attempts > 0) {
        requestAnimationFrame(() => postLoadedWhenReady(anims, attempts - 1));
        return;
      }
      post({ type: 'loaded', animations: anims, duration: d });
    }

    function stopTimeLoop() {
      if (timeTimer) {
        clearInterval(timeTimer);
        timeTimer = null;
      }
    }

    function loadModel(base64Glb) {
      status.textContent = 'Loading model...';
      status.classList.remove('hidden');
      stopTimeLoop();

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      try {
        const binary = atob(base64Glb);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const blob = new Blob([bytes], { type: 'model/gltf-binary' });
        currentBlobUrl = URL.createObjectURL(blob);
        viewer.src = currentBlobUrl;

        viewer.addEventListener('load', () => {
          status.classList.add('hidden');
          const anims = viewer.availableAnimations || [];
          if (anims.length > 0) {
            viewer.animationName = anims[0];
            viewer.play();
            startTimeLoop();
          }
          postLoadedWhenReady(anims, 30);
        }, { once: true });

        viewer.addEventListener('error', () => {
          status.textContent = 'Failed to load model';
          status.classList.remove('hidden');
        }, { once: true });
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
        status.classList.remove('hidden');
      }
    }

    function playAnim() {
      viewer.play();
      startTimeLoop();
    }

    function pauseAnim() {
      viewer.pause();
      stopTimeLoop();
      post({ type: 'time', value: viewer.currentTime || 0 });
    }

    function seekAnim(t) {
      viewer.currentTime = t;
      if (viewer.paused)
        post({ type: 'time', value: t });
    }

    function setAnim(name) {
      viewer.animationName = name;
      viewer.currentTime = 0;
      postLoadedWhenReady(viewer.availableAnimations || [], 30);
    }

    function clearModel() {
      stopTimeLoop();
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
      viewer.src = '';
      status.textContent = 'Click on an entry to preview.';
      status.classList.remove('hidden');
    }

    function setStatus(text) {
      status.textContent = text;
      status.classList.remove('hidden');
    }
  </script>
</body>
</html>
